site_name: ポートフォリオ
nav:
  - Home: index.md
  - About: about.md
  - 販売管理システム (BentoSales):
    - プロダクト要求定義書: ManagementSystem/product-requirements.md
    - 機能設計書: ManagementSystem/functional-design.md
    - アーキテクチャ設計書: ManagementSystem/architecture.md
    - DB設計書: ManagementSystem/database.md
    - リポジトリ構成定義書: ManagementSystem/repository-structure.md
    - 開発ガイドライン: ManagementSystem/development-guidelines.md
    - 用語集: ManagementSystem/glossary.md
  - その他の使い方:
    - Extra1: extras/extra1.md
theme:
  # name: readthedocs
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # font:
  #   text: Noto Sans JP
  #   code: Inconsolata
extra:
  social:
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/
      name: mebiusbox2 on Twitter
    - icon: fontawesome/brands/github
      link: https://github.com/karitonov
extra_css:
  - stylesheets/style.css
extra_javascript:
  - js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
